{% extends "base.html" %}
{% load static %}

{% block title %}SVU Schools — {{ site.site_name }}{% endblock %}

{% block content %}
{% include "includes/page_hero.html" %}

<section class="section">
  <div class="shell">
    <div class="auto-grid">
      {% for school in schools %}
        <div class="school-card">
          <div class="school-card__media">
            <img src="{% static school.card_image %}" alt="{{ school.name }}"
                 loading="lazy" width="700" height="394">
          </div>
          <div class="school-card__body">
            <h2 class="school-card__title">{{ school.name }}</h2>
            <p class="school-card__desc">{{ school.short_description }}</p>
            <div class="school-card__footer">
              <a class="btn btn--outline-gold btn--sm" href="{{ school.url }}">View Details</a>
            </div>
          </div>
        </div>
      {% endfor %}
    </div>
  </div>
</section>
{% endblock %}
